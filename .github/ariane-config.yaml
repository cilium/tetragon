allowed-teams:
  - organization-members

triggers:
  /default\s*:
    workflows: &test-workflows
      - ariane-ci.yaml
      - build-images-ci.yml
      - run-e2e-tests.yaml
      - integration-test.yaml
      - tetragon-rthook-pr.yaml
  /test\s*:
    workflows: *test-workflows

feedback:
  reactions: false

workflows:
  build-images-ci.yml:
    paths-ignore-regex: ^docs/
  run-e2e-tests.yaml:
    paths-ignore-regex: ^docs/
  integration-test.yaml:
    paths-ignore-regex: ^docs/
  tetragon-rthook-pr.yaml:
    paths-ignore-regex: ^docs/
