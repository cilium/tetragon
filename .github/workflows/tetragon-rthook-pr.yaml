name: tetragon-rthooks test
on:
  push:
    branches:
      - main
    paths:
      - 'contrib/tetragon-rthooks/**'

  workflow_dispatch:
    inputs:
      PR-number:
        required: true
        type: string
        description: "Pull request number."
      context-ref:
        required: true
        type: string
        description: "Context in which the workflow runs. If the pull request is from a fork, this is the pull request target branch. Otherwise, this is the pull request branch so committers can test workflow changes directly."
      SHA:
        required: true
        type: string
        description: "SHA under test (head of the pull request branch)."
      base-SHA:
        required: true
        type: string
        description: "SHA of the base branch (target branch of the pull request)."

concurrency:
  group: ${{ github.workflow }}-${{ inputs.PR-number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - name: Set initial commit status
        uses: cilium/actions/set-commit-status@687b48a0547e534dd7270d5069a5ab7967c0e907 # main
        with:
          sha: ${{ inputs.SHA || github.sha }}

  build:
    needs: commit-status-start
    name: Build tetragon-rthooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        path: go/src/github.com/cilium/tetragon/
        persist-credentials: false
        ref: ${{ inputs.SHA || github.sha }}

    - name: Install Go
      uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.26.10'

    - name: Build
      env:
        GOPATH: /home/runner/work/tetragon/tetragon/go
      run: |
        cd go/src/github.com/cilium/tetragon/contrib/tetragon-rthooks
        make

    - name: tar build
      run: |
        cd go/src/github.com/cilium/tetragon/contrib
        tar cz -f /tmp/tetragon-rthooks.tar ./tetragon-rthooks

    - name: upload build
      uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
      with:
         name: tetragon-rthooks-build
         path: /tmp/tetragon-rthooks.tar
         retention-days: 1
  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
        fail-fast: false
        matrix:
           cri:
            - "containerd"
            - "crio"
    steps:
    - name: start minikube
      uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
      with:
        driver: docker
        container-runtime: ${{ matrix.cri }}

    - name: download build data
      uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
      with:
         name: tetragon-rthooks-build

    - name: extract build data
      run: |
        tar xf tetragon-rthooks.tar

    - name: run test
      run: |
        cd tetragon-rthooks
        ./scripts/minikube-install-hook.sh -l
        ./scripts/minikube-test-hook.sh

  post-job-results:
    name: Post Job Results
    if: ${{ always() }}
    needs:
      - build
      - test
    permissions:
      statuses: write
    uses: ./.github/workflows/common-post-jobs.yml
    with:
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.build.result == 'success' && needs.test.result == 'success' }}
