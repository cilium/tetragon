name: tetragon-rthooks test
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

  workflow_dispatch:
    inputs:
      PR-number:
        required: true
        type: string
        description: "Pull request number."
      context-ref:
        required: true
        type: string
        description: "Context in which the workflow runs. If the pull request is from a fork, this is the pull request target branch. Otherwise, this is the pull request branch so committers can test workflow changes directly."
      SHA:
        required: true
        type: string
        description: "SHA under test (head of the pull request branch)."
      base-SHA:
        required: true
        type: string
        description: "SHA of the base branch (target branch of the pull request)."

concurrency:
  group: ${{ github.workflow }}-${{ inputs.PR-number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-status-start:
    name: Commit Status Start
    runs-on: ubuntu-26.04
    permissions:
      statuses: write
    steps:
      - name: Set initial commit status
        uses: cilium/actions/set-commit-status@687b48a0547e534dd7270d5069a5ab7967c0e907 # main
        with:
          sha: ${{ inputs.SHA || github.sha }}

  prepare:
    needs: commit-status-start
    name: Build tetragon-rthooks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      agentImage: ${{ steps.vars.outputs.agentImage }}
      operatorImage: ${{ steps.vars.outputs.operatorImage }}
      rthooksImage: ${{ steps.vars.outputs.rthooksImage }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: go/src/github.com/cilium/tetragon/
        persist-credentials: false
        ref: ${{ inputs.SHA || github.sha }}

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.27.2'

    - name: Set Up Job Variables
      id: vars
      run: |
        SHA=${{ inputs.SHA || github.sha }}
        echo "agentImage=quay.io/cilium/tetragon-ci:${SHA}" >> $GITHUB_OUTPUT
        echo "operatorImage=quay.io/cilium/tetragon-operator-ci:${SHA}" >> $GITHUB_OUTPUT
        echo "rthooksImage=quay.io/cilium/tetragon-rthooks-ci:${SHA}" >> $GITHUB_OUTPUT

    - name: Wait Tetragon Images
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 2
        max_attempts: 30
        retry_wait_seconds: 30
        warning_on_retry: false
        command: |
          set -e
          docker pull ${{ steps.vars.outputs.agentImage }}
          docker pull ${{ steps.vars.outputs.operatorImage }}
          docker pull ${{ steps.vars.outputs.rthooksImage }}
          docker rmi ${{ steps.vars.outputs.agentImage }} ${{ steps.vars.outputs.operatorImage }} ${{ steps.vars.outputs.rthooksImage }}

  test:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
        fail-fast: false
        matrix:
           cri:
            - "containerd"
            - "crio"
    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: go/src/github.com/cilium/tetragon/
        persist-credentials: false
        ref: ${{ inputs.SHA || github.sha }}

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.27.2'

    - name: Install kubectl
      uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      with:
        # renovate: datasource=github-releases depName=kubernetes/kubernetes
        version: v1.37.1

    - name: Install Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        # renovate: datasource=github-releases depName=helm/helm
        version: v4.3.0

    - name: Install Minikube
      uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e # v0.0.21
      with:
        start: false

    - name: Pull Tetragon Images
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      with:
        timeout_minutes: 2
        max_attempts: 30
        retry_wait_seconds: 30
        warning_on_retry: false
        command: |
          set -e
          docker pull ${{ needs.prepare.outputs.agentImage }}
          docker pull ${{ needs.prepare.outputs.operatorImage }}
          docker pull ${{ needs.prepare.outputs.rthooksImage }}


    - name: Run e2e Tests
      run: |
        cd go/src/github.com/cilium/tetragon
        make e2e-test-minikube E2E_BUILD_IMAGES=0 \
        MINIKUBE_CONTAINER_RUNTIME=${{ matrix.cri }} \
        E2E_AGENT=${{ needs.prepare.outputs.agentImage }} \
        E2E_OPERATOR=${{ needs.prepare.outputs.operatorImage }} \
        E2E_RTHOOKS=${{ needs.prepare.outputs.rthooksImage }} \
        EXTRA_TESTFLAGS="-args -v=4"


    - name: Upload Tetragon Logs
      if: failure() || cancelled()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tetragon-logs-${{ matrix.cri }}
        path: /tmp/tetragon.e2e.*
        retention-days: 5

  post-job-results:
    name: Post Job Results
    if: ${{ always() }}
    needs:
      - prepare
      - test
    permissions:
      statuses: write
    uses: ./.github/workflows/common-post-jobs.yml
    with:
      sha: ${{ inputs.SHA || github.sha }}
      success: ${{ needs.prepare.result == 'success' && needs.test.result == 'success' }}
