name: vmtests
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'

jobs:
  build:
    name: Build tetragon
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.ref }}-vmtest-build
      cancel-in-progress: true
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        path: go/src/github.com/cilium/tetragon/

    - name: Install Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        # renovate: datasource=golang-version depName=go
        go-version: '1.27.1'

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libelf-dev netcat-traditional libcap-dev gcc libc6-dev-i386 pahole llvm
        echo `which clang`
        echo `which llc`
        echo `clang --version`
    - name: Build
      env:
        GOPATH: /home/runner/work/tetragon/tetragon/go
      run: |
        cd go/src/github.com/cilium/tetragon/
        make -j3 tetragon-bpf tester-progs test-compile
        make -C tests/vmtests

    - name: Split tests
      run: |
        #  see testfile below
        cd go/src/github.com/cilium/tetragon/
        make split-tetragon-gotests

    - name: tar build
      run: |
        cd go/src/github.com/cilium/
        tar cz --exclude='tetragon/.git' -f /tmp/tetragon.tar ./tetragon

    - name: upload build
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
         name: tetragon-build
         path: /tmp/tetragon.tar
         retention-days: 5
  test:
    strategy:
        fail-fast: false
        matrix:
           kernel:
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - 'rhel8.10-20260921.012558'
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - 'bpf-next-20260921.012558'
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - '6.18-20260921.012558'
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - '6.12-20260921.012558'
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - '6.6-20260921.012558'
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - '6.1-20260921.012558'
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - '5.15-20260921.012558'
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - '5.10-20260921.012558'
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - '5.4-20260921.012558'
              # renovate: datasource=docker depName=quay.io/lvh-images/kernel-images
              - '4.19-20260921.012558'
           group:
              - 0
    concurrency:
      group: ${{ github.ref }}-vmtest-${{ matrix.kernel }}-${{ matrix.group }}
      cancel-in-progress: true
    needs: build
    name: Test kernel ${{ matrix.kernel }} / test group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Remove slow Azure apt mirrors
      uses: cilium/actions/remove-azure-apt-mirrors@687b48a0547e534dd7270d5069a5ab7967c0e907 # main

    - name: Install VM test dependencies
      run: |
        sudo apt-get update
        sudo apt-cache search qemu
        sudo apt-get install -y mmdebstrap libguestfs-tools qemu-utils qemu-system-x86 cpu-checker qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils virtinst virt-manager isc-dhcp-client

    - name: Make kernel accessible
      run: |
        sudo chmod go+rX -R /boot/

    - name: download build data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
         name: tetragon-build

    - name: extract build data
      # NB: currently, due to how tests work, we need to extract to the same path.
      run: |
        mkdir -p go/src/github.com/cilium/
        tar xf tetragon.tar -C go/src/github.com/cilium

    - name: test kernel ${{ matrix.kernel }}
      if: ${{ !startsWith(matrix.kernel, '4.19') }}
      run: |
        cd go/src/github.com/cilium/tetragon
        ./tests/vmtests/fetch-data.sh ${{ matrix.kernel }}
        kimage=$(find tests/vmtests/test-data/kernels -path "*vmlinuz*" -type f)
        echo "Using: kernel:$kimage"
        sudo ./tests/vmtests/tetragon-vmtests-run gotest \
                --kernel ${kimage} \
                --kernel-ver  ${{ matrix.kernel }} \
                --base tests/vmtests/test-data/images/base.qcow2 \
                --cpu 4 \
                --mem 8G \
                --enable-detailed-results \
                --testsfile ./tests/vmtests/test-group-${{ matrix.group }}

    - name: test kernel ${{ matrix.kernel }} with btf file
      if: ${{ startsWith(matrix.kernel, '4.19') }}
      run: |
        cd go/src/github.com/cilium/tetragon
        ./tests/vmtests/fetch-data.sh ${{ matrix.kernel }}
        kimage=$(find tests/vmtests/test-data/kernels -path "*vmlinuz*" -type f)
        btf=$(find tests/vmtests/test-data/kernels -path "*btf*" -type f)
        echo "Using: kernel:$kimage bptf:$btf"
        sudo ./tests/vmtests/tetragon-vmtests-run gotest \
                --kernel ${kimage} \
                --kernel-ver  ${{ matrix.kernel }} \
                --btf-file ${btf} \
                --base tests/vmtests/test-data/images/base.qcow2 \
                --cpu 4 \
                --mem 8G \
                --enable-detailed-results \
                --testsfile ./tests/vmtests/test-group-${{ matrix.group }}

    - name: Chmod test results on failure or cancelation
      if: failure() || cancelled()
      run: |
        sudo chmod -R go+rX go/src/github.com/cilium/tetragon/tests/vmtests/vmtests-results-*

    - name: Upload test results on failure or cancelation
      if: failure() || cancelled()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: tetragon-vmtests-${{ matrix.kernel }}-${{ matrix.group }}-results
        path: go/src/github.com/cilium/tetragon/tests/vmtests/vmtests-results-*
        retention-days: 5

  summary:
    name: Post failure summary
    runs-on: ubuntu-latest
    needs: [test]
    if: failure()
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        fetch-depth: 0

    - name: Download test results
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: tetragon-vmtests-*-results
        path: ${{ runner.temp }}/vmtests-results

    - name: Write summary
      run: |
        set -euo pipefail
        shopt -s nullglob

        # GitHub drops a job summary larger than 1MiB, and the table is written
        # on top of the logs, so this leaves room for it to grow
        MAX_BYTES=800000
        CONTEXT_LINES=20

        resfiles=("$RUNNER_TEMP"/vmtests-results/tetragon-vmtests-*-results/vmtests-results-*/results.json)
        if [ ${#resfiles[@]} -eq 0 ]; then
          echo "The test jobs uploaded no results, they failed before running any test." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        rows=$(mktemp)
        for resfile in "${resfiles[@]}"; do
          resdir=$(dirname "$resfile")
          kernel=$(basename "$(dirname "$resdir")")
          kernel=$(sed -E 's/^tetragon-vmtests-|-results$//g; s/-[0-9]{8}\.[0-9]{6}//' <<< "$kernel")

          # results are named <package>.<test>, when whole package fails there is no test function to look up
          jq -c --arg kernel "$kernel" --arg resdir "$resdir" '
            select(.error)
            | (.name | split(".")) as $p
            | ($p[-1] | startswith("Test")) as $isfunc
            | {test: .name, $kernel,
               func: (if $isfunc then $p[-1] else "" end),
               dir:  (if $isfunc then $p[:-1] | join("/") else "" end),
               log:  (if (.outfile // "") == "" then ""
                      else $resdir + "/" + (.outfile | split("/") | last) end)}' \
            "$resfile" \
            || echo "::warning::$resfile is truncated, the VM died mid-run; some failures are missing from this summary" >&2
        done | jq -rs 'group_by(.test)[] | [
                         .[0].test,
                         .[0].func,
                         .[0].dir,
                         (map(.kernel) | join(" ")),
                         (map(.log) | map(select(. != "")) | first // "")
                       ] | join("\u001f")' > "$rows"

        if [ ! -s "$rows" ]; then
          echo "The test jobs failed but no test did, check the job logs for setup, VM boot or timeout errors." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        table=$(mktemp)
        printf '| Test | File | Author | Kernels |\n|---|---|---|---|\n' > "$table"
        while IFS=$'\x1f' read -r test func dir kernels _; do
          location=
          author=
          if [ -n "$func" ]; then
            match=$(git grep -n "^func ${func}(" -- "${dir:+$dir/}*_test.go" | head -1 || true)
            if [ -n "$match" ]; then
              IFS=: read -r file line _ <<< "$match"
              location="$file:$line"
              author=$(git log --reverse --format='%an' -s \
                -L ":^func ${func}[(]:${file}" 2>/dev/null | head -1 || true)
            fi
          fi
          printf '| `%s` | `%s` | %s | %s |\n' \
            "$test" "${location:-unknown}" "${author:-unknown}" "$kernels" >> "$table"
        done < "$rows"

        details=$(mktemp)
        dropped=0
        while IFS=$'\x1f' read -r test _ _ _ log; do
          [ -f "$log" ] || continue
          if [ "$(wc -c < "$details")" -ge "$MAX_BYTES" ]; then
            dropped=1
            break
          fi
          {
            printf '<details>\n<summary><code>%s</code></summary>\n\n```\n' "$test"
            { grep -C "$CONTEXT_LINES" -- '--- FAIL: ' "$log" || cat "$log"; } \
              | tail -n "$((2 * CONTEXT_LINES + 1))"
            printf '```\n</details>\n\n'
          } >> "$details"
        done < "$rows"

        {
          echo "## vmtests failure summary"
          echo
          echo "### Failed tests ($(wc -l < "$rows" | tr -d ' '))"
          echo
          cat "$table"
          echo
          echo "### Error details"
          echo
          if [ ! -s "$details" ]; then
            echo "No test logs are available, download the workflow artifacts instead."
          fi
          cat "$details"
          if [ "$dropped" -eq 1 ]; then
            echo "The remaining logs were left out to keep this summary under GitHub's 1MiB limit, download the workflow artifacts for them."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

  post-test:
    runs-on: ubuntu-latest
    needs: [test]
    # Fork PRs get a read-only GITHUB_TOKEN that cannot delete artifacts.
    if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      # delete the built binaries from the artifacts in case of overall success
      - uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: tetragon-build
