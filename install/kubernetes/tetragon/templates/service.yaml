{{- if and .Values.tetragon.enabled .Values.tetragon.prometheus.enabled -}}
---
apiVersion: v1
kind: Service
metadata:
  {{- with .Values.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- with .Values.serviceLabelsOverride}}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    {{- include "tetragon.labels" . | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "tetragon.name" . | quote }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: metrics
      port: 2112
      protocol: TCP
      targetPort: {{ .Values.tetragon.prometheus.port | int64 }}
  selector:
    {{- with .Values.daemonSetLabelsOverride}}
    {{- toYaml . | nindent 4 }}
    {{- else }}
    {{- include "tetragon.labels" . | nindent 4 }}
    {{- end }}
  type: ClusterIP
{{- end }}
