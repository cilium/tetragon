{{- if and .Values.tetragon.enabled .Values.tetragon.grpc.tls.enabled .Values.tetragon.grpc.tls.auto.enabled (eq .Values.tetragon.grpc.tls.auto.method "cronJob") (not .Values.tetragon.grpc.tls.server.existingSecret) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-certgen" (include "tetragon.name" .) | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tetragon-certgen.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "tetragon.grpcTlsSecretName" . | quote }}
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ include "tetragon.caSecretName" . | quote }}
    verbs: ["get", "update"]
{{- end }}
