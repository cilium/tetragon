# Demo of restricting file access from kubectl exec processes, while still making the file
# available from the pod process. Apply against a pod labeled app=bigsecret.
apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "enforce-security"
spec:
  podSelector:
    matchLabels:
      app: "bigsecret"
  kprobes:
  - call: "security_file_open"
    syscall: false
    args:
    - index: 0
      type: "file"
    selectors:
    - matchArgs:
      - index: 0
        operator: "Equal"
        values:
        - "/secretfile"
      matchPIDs:
      - operator: NotIn
        followForks: true
        isNamespacePID: true
        values:
        - 1
      matchActions:
      - action: Override
        argError: -1
      - action: Sigkill
